name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

# The jobs only read the code: no write access for the token, and checkout does not keep it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # A hung job stops here instead of after GitHub's 6 hours.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
        env:
          POSTGRES_DB: entrenanutricion
          POSTGRES_USER: entrenanutricion
          POSTGRES_PASSWORD: entrenanutricion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U entrenanutricion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://entrenanutricion:entrenanutricion@localhost:5432/entrenanutricion
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: "pip install --require-hashes --only-binary=:all: -r requirements-dev.txt"
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Known vulnerabilities in the dependencies
        run: pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Production settings pass the deploy checklist
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-length-and-entropy-0123456789abcdef
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null --settings=config.settings.test
      - name: PostgreSQL 16 client tools (same major version as the server)
        # From the official PGDG repository: the runner's own Ubuntu may ship another version.
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            # PGDG's must be the only key of the file (same fingerprint as backend/Dockerfile).
            test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg \
              | awk -F: '$1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }')" \
              = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo apt-get install -y postgresql-client-16
          fi
          echo "PG_BIN_DIR=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    # A hung job stops here instead of after GitHub's 6 hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in the dependencies
        # Shipped code: any moderate or worse issue fails. Dev tooling: only critical ones.
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=critical
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # A hung job stops here instead of after GitHub's 6 hours.
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16.15@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
        env:
          POSTGRES_DB: entrenanutricion
          POSTGRES_USER: entrenanutricion
          POSTGRES_PASSWORD: entrenanutricion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U entrenanutricion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://entrenanutricion:entrenanutricion@localhost:5432/entrenanutricion
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend with demo data
        working-directory: backend
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_demo
      - name: PostgreSQL 16 client tools (same major version as the server)
        # From the official PGDG repository: the runner's own Ubuntu may ship another version.
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            # PGDG's must be the only key of the file (same fingerprint as backend/Dockerfile).
            test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg \
              | awk -F: '$1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }')" \
              = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo apt-get install -y postgresql-client-16
          fi
          echo "PG_BIN_DIR=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Restore drill on the demo data
        working-directory: backend
        run: python manage.py restore_drill
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright on the production build (vite preview, with its CSP)
        working-directory: frontend
        env:
          E2E_PREVIEW: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    # A hung job stops here instead of after GitHub's 6 hours.
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Throwaway secrets for the production stack
        # Production refuses missing or published keys, seed_demo --allow-production needs a
        # password of its own for the demo accounts, and the production compose has no database
        # password by default.
        run: |
          key="$(openssl rand -base64 48 | tr -d '\n')"
          password="Demo-$(openssl rand -hex 12)"
          database="$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          echo "::add-mask::$password"
          echo "::add-mask::$database"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$database" >> "$GITHUB_ENV"
      - name: Compose files are valid
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
      - name: Production images and stack
        run: docker compose -f docker-compose.prod.yml up --build -d
      - name: Smoke test (nginx → gunicorn → Postgres)
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 2; done
          curl -fsS http://localhost:8080/api/v1/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS http://localhost:8080/app/training | grep -q 'id="root"'
          curl -fsS http://localhost:8080/manifest.webmanifest | grep -q entrenanutricion
          # Security headers on the entry point and on the hashed assets (nginx location blocks).
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy: default-src 'self'"
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080$asset" | grep -qi "x-content-type-options: nosniff"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/me)" = 401
          # API answers are never cached (personal and health data).
          curl -fsSI http://localhost:8080/api/v1/health | grep -qi "cache-control: no-store"
      - name: Load smoke test (k6, 20 virtual clients for 30 s)
        run: |
          docker compose -f docker-compose.prod.yml exec -T -e DEMO_PASSWORD="$DEMO_PASSWORD" backend \
            python manage.py seed_demo --allow-production
          docker run --rm --network host -v "$PWD/load:/load" -e BASE_URL=http://localhost:8080 \
            -e DEMO_PASSWORD="$DEMO_PASSWORD" \
            grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6 run --summary-trend-stats "avg,p(95),max" /load/smoke.js
      - name: Backup and restore drill inside the production image
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py backup_database
          docker compose -f docker-compose.prod.yml exec -T backend python manage.py restore_drill
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs
