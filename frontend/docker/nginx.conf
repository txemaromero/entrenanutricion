# SPA + reverse proxy to the API (docker-compose.prod.yml). On Render the static site is
# served by Render itself and the API lives on its own domain.

# Access log without query strings nor referrers: they can carry searches by name, the address
# asked to /auth/email-exists and the tokens of the reset and confirmation pages.
log_format private '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

server {
    access_log /var/log/nginx/access.log private;
    # Unprivileged port: nginx runs without root (nginx-unprivileged image).
    listen 8080;
    server_name _;
    # No nginx version in the Server header nor in the error pages.
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 60m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same proxy headers as the API: Django sees the client and the scheme (rate limits, logs).
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate the entry points so new deploys are picked up.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
